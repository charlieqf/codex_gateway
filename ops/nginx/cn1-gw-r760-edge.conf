# CN1 edge vhost for the R760 Codex Gateway origin.
#
# This file is intentionally pinned to the current R760 public NAT address.
# Before enabling it, confirm that 117.186.49.26:1443 still presents a valid
# certificate for goldencode.instmarket.com.au.  The client-facing certificate
# below is issued and renewed independently on CN1 with DNS-01.

upstream codex_gateway_r760_tls {
    server 117.186.49.26:1443 max_fails=3 fail_timeout=10s;
    keepalive 32;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

map $http_x_request_id $codex_edge_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

server {
    listen 80;
    listen [::]:80;
    server_name gw.instmarket.com.au;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name gw.instmarket.com.au;

    ssl_certificate /etc/letsencrypt/live/gw.instmarket.com.au/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gw.instmarket.com.au/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Keep the current Azure edge compatibility limit.
    client_max_body_size 5m;

    location / {
        proxy_pass https://codex_gateway_r760_tls;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_ssl_server_name on;
        proxy_ssl_name goldencode.instmarket.com.au;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_session_reuse on;

        proxy_connect_timeout 15s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;

        # The origin vhost requires its own Host/SNI name. Preserve the public
        # client hostname separately for URL construction and audit context.
        proxy_set_header Host goldencode.instmarket.com.au;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Id $codex_edge_request_id;
    }
}
