# Include only inside the existing goldencode.instmarket.com.au server block.
# Installation/reload requires explicit approval; the application defaults off.
location ^~ /gateway/imaging/ {
    # Gateway's independent imaging audit retains subject, route, IDs and outcome.
    # Avoid duplicating arbitrary client query strings into ordinary edge logs.
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 8m;
    client_body_timeout 30s;
    proxy_pass http://127.0.0.1:18787;
    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_send_timeout 125s;
    proxy_read_timeout 125s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 1443;
    proxy_set_header Connection "";
}
