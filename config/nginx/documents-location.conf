# Include inside the existing GoldenCode TLS server only; no new listener.
location ^~ /gateway/documents/v1/ {
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 50m;
    client_body_timeout 90s;
    error_page 413 = @documents_size_limit;
    proxy_pass http://127.0.0.1:18787;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_send_timeout 90s;
    proxy_read_timeout 90s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 1443;
    proxy_set_header Connection "";
}

location @documents_size_limit {
    internal;
    default_type application/json;
    add_header Cache-Control no-store always;
    return 413 '{"error":{"code":"request_size_limit"}}';
}
